<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="Author" content="Ismael Abdeslam Zaim Wadghiri Amnad">
    <link rel="stylesheet" href="index.css">
    <title>Pixel Zone</title>
</head>
<body>
    <header>
         <div class="logo">
            <h1>PIXEL ZONE</h1>
         </div>
    </header>
    <main>
        <form action="#" method="post" enctype="multipart/form-data">
            <fieldset>
                <legend>Nueva reserva</legend>
                <div class="elemento-formulario">
                        <label for="nombre">Nombre del cliente:</label>
                        <input type="text" id="nombre" name="nombre" placeholder="Introduce tu nombre" required>
                </div>
                <div class="elemento-formulario">
                    <label for="correo">Correo electrónico:</label>
                    <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" required>
                </div>
                <div class="elemento-formulario">
                    <label for="telefono">Teléfono:</label>
                    <input type="tel" id="telefono" name="telefono">
                </div>
                <div class="elemento-formulario">
                    <label for="plataforma">Plataforma:</label>
                    <select id="plataforma" name="plataforma" required>
                        <option value="">Selecciona una plataforma</option>
                        <option value="pc">PC</option>
                        <option value="playstation">PlayStation</option>
                        <option value="xbox">Xbox</option>
                        <option value="nintendo">Nintendo Switch</option>
                    </select>
                </div>
                <div class="elemento-formulario">
                    <label for="producto">Producto a reservar:</label>
                    <input type="text" id="producto" name="producto" list="productos" placeholder="Busca un producto" required>
                    <datalist id="productos">
                        <option value="EA Sports FC 27">
                        <option value="Minecraft">
                        <option value="Mario Kart">
                        <option value="Grand Theft Auto V">
                        <option value="The Legend of Zelda">
                    </datalist>
                </div>
                <div class="elemento-formulario">
                    <p>Edición del producto:</p>
                    <input type="radio" id="estandar" name="edicion" value="estandar" required>
                    <label for="estandar">Estándar</label>
                    <input type="radio" id="deluxe" name="edicion" value="deluxe">
                    <label for="deluxe">Deluxe</label>
                    <input type="radio" id="coleccionista" name="edicion" value="coleccionista">
                    <label for="coleccionista">Coleccionista</label>
                </div>
                <div class="elemento-formulario">
                    <label for="cantidad">Cantidad:</label>
                    <input type="number" id="cantidad" name="cantidad" min="1" required>
                </div>
                <div class="elemento-formulario">
                    <label for="fecha">Fecha de recogida:</label>
                    <input type="date" id="fecha" name="fecha" required>
                </div>
                <div class="elemento-formulario">
                    <label for="presupuesto">Presupuesto máximo:</label>
                    <input type="range" id="presupuesto" name="presupuesto" min="0" max="500" step="10" required>
                </div>
                <div class="elemento-formulario">
                    <label for="observaciones">Observaciones:</label>
                    <textarea id="observaciones" name="observaciones" placeholder="Escribe tus observaciones..."></textarea>
                </div>
                <div class="elemento-formulario">
                    <label for="imagen">Imagen del producto:</label>
                    <input type="file" id="imagen" name="imagen" accept="image/*">
                </div>
                <div class="elemento-formulario">
                    <button type="submit">Enviar reserva</button>
                    <button type="reset">Restablecer</button>
                </div>
            </fieldset>
        </form>
    </main>
    <footer>

        <h3>Síguenos en redes</h3>

        <a href="https://www.facebook.com/" target="_blank">
            <img src="imagenes/facebook.png" alt="Facebook">
        </a>

        <a href="https://www.instagram.com/" target="_blank">
            <img src="imagenes/instagram.png" alt="Instagram">
        </a>

        <a href="https://x.com/" target="_blank">
            <img src="imagenes/twitter.png" alt="Twitter X">
        </a>

        <a href="https://www.youtube.com/" target="_blank">
            <img src="imagenes/youtube.png" alt="YouTube">
        </a>
        
    </footer>
    
</body>
</html>
